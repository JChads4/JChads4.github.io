<title id="t">Collocation points and initial conditions for a PINN</title>
<desc id="d">The damped oscillator solution x(t) for mu = 0.5, k = 4, from t = 0 to 10. Twenty collocation points are spread along the time axis, where the ODE residual is evaluated with no measurement. The only fixed values are the initial conditions at t = 0.</desc>
